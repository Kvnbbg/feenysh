# H2 Database Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:feenydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update # Automatically update schema. Use "validate" or "none" in production.
spring.jpa.show-sql=true # Show SQL queries in logs, useful for debugging
spring.jpa.properties.hibernate.format_sql=true # Format SQL queries in logs

# For PostgreSQL, you would comment out H2 and uncomment something like this:
# spring.datasource.url=jdbc:postgresql://localhost:5432/feenysh_db
# spring.datasource.username=your_postgres_user
# spring.datasource.password=your_postgres_password
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=update # Or validate/none for production

# JWT Configuration
# IMPORTANT: For production, use a strong, randomly generated secret and store it securely (e.g., environment variable)
app.jwtSecret=YourSuperSecretKeyWhichShouldBeVeryLongAndRandomAndStoredSecurely12345
app.jwtExpirationInMs=86400000 # 24 hours
